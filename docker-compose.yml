name: monitor-ambiental-front

services:
  frontend:
    image: ghcr.io/kadupenido/monitor-ambiental-front:${IMAGE_TAG:-latest}
    container_name: monitor-ambiental-web
    restart: unless-stopped
    environment:
      PORT: 4000
      API_UPSTREAM: http://monitor-ambiental-api:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.monitor-ambiental-front.rule=Host(`tempo.kadupenido.com`)
      - traefik.http.routers.monitor-ambiental-front.entrypoints=websecure
      - traefik.http.routers.monitor-ambiental-front.tls.certresolver=letsencrypt
      - traefik.http.routers.monitor-ambiental-front.priority=1
      - traefik.http.services.monitor-ambiental-front.loadbalancer.server.port=4000
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
    name: traefik-public
